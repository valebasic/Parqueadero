directories:
  output: dist
  buildResources: build
appId: com.nexoapp.facaparking
productName: Nexo.app
files:
  - filter:
      - main.js
      - icon.ico
      - icon.png
      - login.html
      - index.html
      - ParkApp.html
      - mensualidades.html
      - caja.html
      - pagos.html
      - egresos.html
      - reportes.html
      - configuracion.html
      - registro.html
      - pendientes.html
      - mvc/**/*
      - assets/**/*
      - fonts/**/*
win:
  target: nsis
  icon: icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Nexo.app
  createDesktopShortcut: true
  createStartMenuShortcut: true
electronVersion: 31.7.7
